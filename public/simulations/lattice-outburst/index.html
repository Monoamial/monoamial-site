<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lattice outburst simulation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="outburst" aria-label="Lattice outburst simulation">
    <div class="canvas-wrap">
      <canvas id="lattice" role="img" aria-label="Lattice with one infected site at the origin." aria-describedby="event-description"></canvas>
      <dl class="readouts" aria-label="Simulation measurements">
        <div><dt>Sites</dt><dd id="site-count">1</dd></div>
        <div><dt>Time</dt><dd id="model-time">0.000</dd></div>
      </dl>
    </div>
    <div class="legend" aria-label="Color legend">
      <span><i class="infected"></i>Infected</span>
      <span><i class="new"></i>New</span>
      <span><i class="center"></i>Centre</span>
    </div>
    <div class="controls">
      <div class="buttons">
        <button id="run" type="button" class="primary" aria-pressed="false">Run</button>
        <button id="step" type="button">Step</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <div class="alpha-control">
        <label for="alpha">α <output id="alpha-value" for="alpha">3.0</output></label>
        <input id="alpha" type="range" min="2" max="9" step="0.1" value="3" aria-label="Decay exponent alpha">
      </div>
    </div>
    <p class="caption">Radii 1–24 · One event per animation step · Clock shows model time</p>
    <p id="event-description" class="sr-only">One infected site at the origin.</p>
    <p id="limit-status" class="limit-status" role="status" hidden></p>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
